[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "borrowcycle"
version = "1.0.0"
description = "Build-peak-collapse dynamics of the hard-to-borrow futures premium on NSE"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "arcticdb>=4.0",
    "requests>=2.31",
    "kiteconnect>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["borrowcycle", "borrowcycle.pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
